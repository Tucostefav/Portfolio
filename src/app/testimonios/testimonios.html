@if (textos.datos(); as t) {

<section class="seccion" id="testimonios">
  <div class="contenedor">

    <app-titulo-seccion [texto]="t.testimonials.eyebrow"></app-titulo-seccion>

    <div class="grid grid--3">
      @for (comentario of comentarios; track $index) {
        <app-tarjeta>
          <p class="comilla">&ldquo;</p>
          <p class="texto-apoyo">{{ comentario.texto }}</p>
          <p class="nombre">{{ comentario.nombre }}</p>
          <p class="cargo">{{ comentario.cargo }}</p>
        </app-tarjeta>
      }
    </div>

  </div>
</section>

}
