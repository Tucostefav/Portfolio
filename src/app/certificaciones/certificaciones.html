@if (textos.datos(); as t) {

<section class="seccion seccion--blanca" id="educacion">
  <div class="contenedor">

    <app-titulo-seccion [texto]="t.certifications.eyebrow"></app-titulo-seccion>

    <div class="grid grid--2">
      @for (estudio of estudios; track $index) {
        <app-tarjeta>
          <h3 class="nombre">{{ estudio.titulo }}</h3>
          <p class="texto-apoyo">{{ estudio.lugar }}</p>
          @if (estudio.enCurso) {
            <p class="estado">{{ t.certifications.studying }}</p>
          }
        </app-tarjeta>
      }
    </div>

  </div>
</section>

}
